services:
  burnbridge:
    build:
      context: .
      dockerfile: tests/Dockerfile.dev
      args:
        - IAM_DIR=${IAM_DIR}
        - SETUP_DIR=${SETUP_DIR}
    volumes:
      - ./:/app
    ports:
      - "${PORT}:${PORT}"
    command: ["sh", "-c", CompileDaemon -build="go build -C ./cmd/versitygw -o versitygw" -command="./cmd/versitygw/versitygw -p :$PORT -a $ACCESS_KEY_ID -s $SECRET_ACCESS_KEY --iam-dir $IAM_DIR burnbridge --db-path $SETUP_DIR/burnbridge-meta.sqlite --grpc-addr ${VGW_BURNBRIDGE_GRPC_ADDR:-127.0.0.1:50051} --grpc-skip-ping"]
