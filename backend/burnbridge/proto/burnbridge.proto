syntax = "proto3";

package burnbridge.v1;

// .NET Core gRPC generated namespace
option csharp_namespace = "BurnServer.Protos.BurnBridge.V1";

// GO gRPC generated namespace
option go_package = "github.com/versity/versitygw/backend/burnbridge/proto;burnbridgev1";

// BurnBridge recorder API.
//
// Compatibility goal:
// - Keep wire fields compatible with versitygw/backend/burnbridge/proto/burnbridge.proto
// - Allow direct interop between Go gateway and .NET Core BurnServer
service BurnBridge {
  // Query recorder service version and runtime metadata.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // Create a logical write job for one S3 object.
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);

  // Bidirectional upload stream.
  // Server should ack per logical segment and optionally emit final summary ack.
  rpc UploadObject(stream UploadObjectChunk) returns (stream UploadObjectAck);

  // Finalize a job and persist layout/session metadata.
  rpc CommitJob(CommitJobRequest) returns (CommitJobResponse);

  // Finalize multiple uploaded jobs in one recorder drain/flush cycle.
  rpc CommitJobBatch(CommitJobBatchRequest) returns (CommitJobBatchResponse);

  // Query current job status.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // Request cooperative cancel.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Read object bytes by (bucket, object_key) from offset.
  // length == 0 means stream to object end.
  rpc ReadObject(ReadObjectRequest) returns (stream ReadObjectChunk);

  // Register pull source so recorder can fetch bytes directly from S3-compatible endpoint.
  rpc RegisterS3ObjectPullSource(RegisterS3ObjectPullSourceRequest) returns (RegisterS3ObjectPullSourceResponse);

  // Probe whether current unit/session is ready for I/O.
  rpc TestUnitReady(TestUnitReadyRequest) returns (TestUnitReadyResponse);

  // Subscribe to recorder unit/media readiness updates.
  rpc WatchUnitStatus(WatchUnitStatusRequest) returns (stream UnitStatusEvent);

  // Query drive + disc information.
  rpc GetDiscInfo(GetDiscInfoRequest) returns (GetDiscInfoResponse);

  // Explicitly notify the recorder about a media insert/remove event.
  rpc HandleMediaChange(HandleMediaChangeRequest) returns (HandleMediaChangeResponse);

  // Explicitly open or close the recorder tray.
  rpc HandleTray(HandleTrayRequest) returns (HandleTrayResponse);

  // Return the currently imported on-disc metadata snapshot maintained by the recorder.
  rpc GetImportedBucketState(GetImportedBucketStateRequest) returns (GetImportedBucketStateResponse);

  // Finalize accumulated UDF layout on disc using persisted layout metadata (closes stream write session).
  rpc FinalizeLayout(FinalizeLayoutRequest) returns (FinalizeLayoutResponse);

  // Replace recorder license.xml content and optionally reload the shared burner host.
  rpc UpdateLicense(UpdateLicenseRequest) returns (UpdateLicenseResponse);

  // Upload an upgrade package into the recorder staging directory.
  rpc UploadUpgradePackage(stream UploadUpgradePackageChunk) returns (UploadUpgradePackageResponse);

  // Execute the configured recorder upgrade apply command for a staged package.
  rpc ApplyUpgrade(ApplyUpgradeRequest) returns (ApplyUpgradeResponse);
}

message GetVersionRequest {}

message GetVersionResponse {
  string service_name = 1;
  string service_version = 2;
  string assembly_version = 3;
  string runtime_version = 4;
  string build_configuration = 5;
  string process_architecture = 6;
  string os_description = 7;
  string base_directory = 8;
  string license_file_path = 9;
}

message TestUnitReadyRequest {}

message WatchUnitStatusRequest {
  bool include_initial_snapshot = 1;
}

message TestUnitReadyResponse {
  bool ready = 1;
  string message = 2;
  string volume_label = 3;
  int64 total_capacity_bytes = 4;
  int64 free_capacity_bytes = 5;
  string media_type = 6;
  int64 used_capacity_bytes = 7;
  int64 writable_capacity_bytes = 8;
  int64 finalize_reserve_bytes = 9;
  int32 block_size_bytes = 10;
  int32 total_blocks = 11;
  int32 free_blocks = 12;
  int32 recordable_capacity_blocks = 13;
  int32 track_next_writable_address = 14;
  bool track_next_writable_address_valid = 16;
  string disc_serial_number_hex = 15;
  string writable_state = 17;
}

message UnitStatusEvent {
  TestUnitReadyResponse snapshot = 1;
  int64 sequence = 2;
  string source = 3;
}

message GetDiscInfoRequest {
  int32 device_index = 1;
  bool include_session_disc_id = 2;
  bool include_drive_identity = 3;
}

message GetDiscInfoResponse {
  OpticalDriveIdentity drive = 1;
  OpticalDiscInfo disc = 2;
}

enum MediaChangeAction {
  MEDIA_CHANGE_ACTION_UNSPECIFIED = 0;
  MEDIA_CHANGE_ACTION_INSERTED = 1;
  MEDIA_CHANGE_ACTION_REMOVED = 2;
}

message HandleMediaChangeRequest {
  MediaChangeAction action = 1;
  string reason = 2;
}

message HandleMediaChangeResponse {
  string status = 1;
  string message = 2;
  string imported_bucket = 3;
  TestUnitReadyResponse snapshot = 4;
}

enum TrayAction {
  TRAY_ACTION_UNSPECIFIED = 0;
  TRAY_ACTION_OPEN = 1;
  TRAY_ACTION_CLOSE = 2;
}

message HandleTrayRequest {
  TrayAction action = 1;
  string reason = 2;
}

message HandleTrayResponse {
  string status = 1;
  string message = 2;
}

message GetImportedBucketStateRequest {
  string bucket = 1;
}

message GetImportedBucketStateResponse {
  string bucket = 1;
  string udf_volume_label = 2;
  string metadata_db_file_name = 3;
  bool loaded = 4;
  repeated ImportedObjectState objects = 5;
  repeated ObjectMetadata bucket_metadata = 6;
}

message ImportedObjectState {
  string object_key = 1;
  int64 size = 2;
  string etag = 3;
  string last_modified_utc = 4;
  string content_type = 5;
  string content_encoding = 6;
  string content_disposition = 7;
  string content_language = 8;
  string cache_control = 9;
  string expires = 10;
  repeated ObjectMetadata metadata = 11;
}

message OpticalDriveIdentity {
  string vendor_id = 1;
  string product_id = 2;
  string product_revision = 3;
  string serial_number = 4;
  bool is_mmc_unit = 5;
}

message OpticalDiscInfo {
  int32 media_profile = 1;
  bool media_is_blank = 2;
  bool media_is_cd = 3;
  bool media_is_dvd = 4;
  bool media_is_bd = 5;

  int32 profile_code = 6;
  string profile_name = 7;

  int32 disc_status_code = 8;
  string disc_status_name = 9;

  bool is_erasable = 10;

  string disc_vendor_id = 11;
  string disc_serial_number_hex = 12;

  int32 block_size_bytes = 13;
  int32 track_next_writable_address = 14;
  bool track_next_writable_address_valid = 23;
  string writable_state = 24;
  // User-data byte totals from Primo block counters times block_size_bytes (bluray-demo: scaled capacity / free space).
  int64 media_capacity = 15;
  int64 media_free_space = 16;
  // Consumed user-data bytes: bluray-demo Burner.MediaUsedSpace after scaling by block_size (max(0, media_capacity - media_free_space) with BurnServer scaling).
  int64 media_used_space = 17;
  int32 total_blocks = 18;
  int32 free_blocks = 19;
  int32 recordable_capacity_blocks = 20;

  repeated DiscRwSpeedDescriptor rw_speeds = 21;
  SessionDiscId session_disc_id = 22;
}

message DiscRwSpeedDescriptor {
  int32 read_value = 1;
  int32 write_value = 2;
}

message SessionDiscId {
  bool is_finalized = 1;
  string temp_disc_id = 2;
}

message S3PullCredentials {
  string access_key_id = 1;
  string secret_access_key = 2;
  string session_token = 3;
}

message S3ObjectPullSource {
  string endpoint_url = 1;
  string region = 2;
  string bucket = 3;
  string object_key = 4;
  bool force_path_style = 5;
  S3PullCredentials credentials = 6;
  string presigned_get_url = 7;
  int64 content_length_hint = 8;
}

message RegisterS3ObjectPullSourceRequest {
  string job_id = 1;
  S3ObjectPullSource source = 2;
}

message RegisterS3ObjectPullSourceResponse {}

message ReadObjectRequest {
  string job_id = 1; // optional legacy field
  string bucket = 2;
  string object_key = 3;
  int64 offset = 4;
  int64 length = 5;
}

message ReadObjectChunk {
  bytes data = 1;
}

message ObjectMetadata {
  string key = 1;
  string value = 2;
}

message CreateJobRequest {
  string bucket = 1;
  string object_key = 2;
  int64 content_length = 3;
  repeated ObjectMetadata metadata = 4;
}

message CreateJobResponse {
  string job_id = 1;
}

message UploadObjectChunk {
  string job_id = 1;
  int64 offset = 2;
  bytes data = 3;
  bool eof = 4;
  int64 reused_burned_bytes = 5;
}

message DiscExtent {
  string disc_address = 1;
  int64 file_size = 2;
}

enum SegmentBurnResult {
  SEGMENT_BURN_RESULT_UNSPECIFIED = 0;
  SEGMENT_BURN_RESULT_OK = 1;
  SEGMENT_BURN_RESULT_FAILED = 2;
}

message UploadObjectAck {
  string job_id = 1;
  int32 segment_index = 2;
  int64 byte_offset = 3;
  int64 byte_size = 4;
  repeated DiscExtent disc_extents = 5;
  bool upload_complete = 6;
  int64 bytes_received = 7;
  string checksum_md5 = 8;
  SegmentBurnResult segment_burn_result = 9;
  string segment_burn_error = 10;
}

message CommitJobRequest {
  string job_id = 1;
  string udf_volume_label = 2;
  FinalizeManifest finalize_manifest = 3;
  bool close_disc = 4;
  string committed_etag = 5;
  int64 committed_content_length = 6;
}

message CommitJobResponse {
  string job_id = 1;
  string status = 2;
}

message CommitJobBatchRequest {
  repeated CommitJobRequest jobs = 1;
}

message CommitJobBatchResponse {
  repeated CommitJobResponse jobs = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  string status = 2;
  string message = 3;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  string job_id = 1;
  string status = 2;
}

message FinalizeLayoutRequest {
  string bucket = 1;
  string udf_volume_label = 2;
  bool close_disc = 3;
}

message FinalizeLayoutResponse {
  string bucket = 1;
  string status = 2;
  string message = 3;
}

message UpdateLicenseRequest {
  string file_name = 1;
  bytes content = 2;
  bool reload_now = 3;
}

message UpdateLicenseResponse {
  string status = 1;
  string message = 2;
  string license_file_path = 3;
  string sha256 = 4;
}

message UploadUpgradePackageChunk {
  string file_name = 1;
  bytes data = 2;
  bool eof = 3;
}

message UploadUpgradePackageResponse {
  string status = 1;
  string message = 2;
  string stored_path = 3;
  int64 bytes_received = 4;
  string sha256 = 5;
}

message ApplyUpgradeRequest {
  string staged_file_name = 1;
}

message ApplyUpgradeResponse {
  string status = 1;
  string message = 2;
  string command = 3;
  string staged_path = 4;
  int32 exit_code = 5;
  string output = 6;
}

message FinalizeManifest {
  repeated FinalizeFile files = 1;
}

message FinalizeFile {
  string object_key = 1;
  int64 file_size = 2;
  repeated SegmentLayout segments = 3;
}

message SegmentLayout {
  int32 segment_index = 1;
  int64 byte_offset = 2;
  int64 byte_size = 3;
  string checksum_md5 = 4;
  repeated DiscExtent disc_extents = 5;
}
